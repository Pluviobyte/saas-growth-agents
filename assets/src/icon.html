<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.wrap{width:512px;height:512px;display:flex;align-items:center;justify-content:center}
.tile{width:448px;height:448px;border-radius:100px;background:linear-gradient(180deg,#FBFBFB 0%,#ECECEC 100%);
box-shadow:inset 0 0 0 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center}
</style></head><body><div class="wrap"><div class="tile">
<svg width="300" height="300" viewBox="0 12 300 300" fill="none">
  <!-- baseline grid -->
  <path d="M40 252 H262" stroke="#141414" stroke-width="10" stroke-linecap="round" opacity=".14"/>
  <!-- growth path through three agent nodes -->
  <path d="M52 214 L118 160 L170 184 L236 92" stroke="#141414" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <path d="M190 84 L246 78 L240 134" stroke="#141414" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes -->
  <circle cx="52" cy="214" r="24" fill="#FBFBFB" stroke="#141414" stroke-width="14"/>
  <circle cx="118" cy="160" r="24" fill="#141414"/>
  <circle cx="170" cy="184" r="24" fill="#FBFBFB" stroke="#141414" stroke-width="14"/>
</svg></div></div></body></html>
